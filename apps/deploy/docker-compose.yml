# The PINNeAPPle apps (HeatSink Sizer, PCB Hotspot, Data Health, Data Standardizer,
# Simulation Metadata) on one server, behind one Caddy (automatic HTTPS).
#
#   cp .env.example .env      # set the domains, logins and e-mail
#   docker compose up -d --build
#
# Needs ports 80 and 443 open and a DNS A record for each domain pointing at
# this server. See README.md for the full walkthrough.
name: pinneapple-apps

services:
  heatsink:
    build:
      context: ../..                          # repository root
      dockerfile: apps/heatsink_sizer/Dockerfile
    image: pinneapple/heatsink-sizer:latest
    restart: unless-stopped
    environment:
      HSS_USER: ${HSS_USER:-}
      HSS_PASSWORD: ${HSS_PASSWORD:-}
      HSS_MAX_SIZING: ${HSS_MAX_SIZING:-2}
    expose: ["8080"]
    mem_limit: ${HSS_MEM_LIMIT:-2g}

  pcb:
    build:
      context: ../..
      dockerfile: apps/pcb_hotspot/Dockerfile
    image: pinneapple/pcb-hotspot:latest
    restart: unless-stopped
    environment:
      PCB_USER: ${PCB_USER:-}
      PCB_PASSWORD: ${PCB_PASSWORD:-}
      PCB_MAX_HEAVY: ${PCB_MAX_HEAVY:-2}
    expose: ["8081"]
    mem_limit: ${PCB_MEM_LIMIT:-2g}

  datahealth:
    build:
      context: ../..
      dockerfile: apps/data_health/Dockerfile
    image: pinneapple/data-health:latest
    restart: unless-stopped
    environment:
      EDH_USER: ${EDH_USER:-}
      EDH_PASSWORD: ${EDH_PASSWORD:-}
      EDH_MAX_HEAVY: ${EDH_MAX_HEAVY:-2}
      EDH_MAX_MB: ${EDH_MAX_MB:-50}
    expose: ["8082"]
    mem_limit: ${EDH_MEM_LIMIT:-2g}

  standardizer:
    build:
      context: ../..
      dockerfile: apps/data_standardizer/Dockerfile
    image: pinneapple/data-standardizer:latest
    restart: unless-stopped
    environment:
      EDS_USER: ${EDS_USER:-}
      EDS_PASSWORD: ${EDS_PASSWORD:-}
      EDS_MAX_HEAVY: ${EDS_MAX_HEAVY:-2}
      EDS_MAX_MB: ${EDS_MAX_MB:-80}
    expose: ["8083"]
    mem_limit: ${EDS_MEM_LIMIT:-2g}

  simmeta:
    build:
      context: ../..
      dockerfile: apps/simulation_metadata/Dockerfile
    image: pinneapple/simulation-metadata:latest
    restart: unless-stopped
    environment:
      SMD_USER: ${SMD_USER:-}
      SMD_PASSWORD: ${SMD_PASSWORD:-}
      SMD_MAX_HEAVY: ${SMD_MAX_HEAVY:-2}
      SMD_MAX_MB: ${SMD_MAX_MB:-100}
    expose: ["8084"]
    mem_limit: ${SMD_MEM_LIMIT:-2g}

  udr:
    build:
      context: ../..
      dockerfile: apps/design_requirements/Dockerfile
    image: pinneapple/design-requirements:latest
    restart: unless-stopped
    environment:
      UDR_USER: ${UDR_USER:-}
      UDR_PASSWORD: ${UDR_PASSWORD:-}
      UDR_MAX_HEAVY: ${UDR_MAX_HEAVY:-2}
      UDR_MAX_MB: ${UDR_MAX_MB:-40}
      UDR_FORM_PDF: ${UDR_FORM_PDF:-}          # e.g. /forms/u-dr-1.pdf (your copy, mounted below)
      UDR_OLLAMA_URL: ${UDR_OLLAMA_URL:-http://ollama:11434}   # local LLM (optional, see the ollama service)
      UDR_OLLAMA_MODEL: ${UDR_OLLAMA_MODEL:-}  # empty = rule-based reading only
      UDR_OLLAMA_TIMEOUT: ${UDR_OLLAMA_TIMEOUT:-600}
    extra_hosts: ["host.docker.internal:host-gateway"]   # for an Ollama already running on the host
    volumes:
      - ./forms:/forms:ro
    expose: ["8085"]
    mem_limit: ${UDR_MEM_LIMIT:-2g}

  inverse:
    build:
      context: ../..
      dockerfile: apps/inverse_heat/Dockerfile
    image: pinneapple/inverse-heat:latest
    restart: unless-stopped
    environment:
      IHL_USER: ${IHL_USER:-}
      IHL_PASSWORD: ${IHL_PASSWORD:-}
      IHL_MAX_JOBS: ${IHL_MAX_JOBS:-2}
      IHL_THREADS: ${IHL_THREADS:-1}
    expose: ["8086"]
    mem_limit: ${IHL_MEM_LIMIT:-2g}

  preflight:
    build:
      context: ../..
      dockerfile: apps/simulation_preflight/Dockerfile
    image: pinneapple/simulation-preflight:latest
    restart: unless-stopped
    environment:
      PFL_USER: ${PFL_USER:-}
      PFL_PASSWORD: ${PFL_PASSWORD:-}
      PFL_MAX_HEAVY: ${PFL_MAX_HEAVY:-2}
      PFL_MAX_MB: ${PFL_MAX_MB:-200}
    expose: ["8087"]
    mem_limit: ${PFL_MEM_LIMIT:-2g}

  mesh:
    build:
      context: ../..
      dockerfile: apps/mesh_quality/Dockerfile
    image: pinneapple/mesh-quality:latest
    restart: unless-stopped
    environment:
      MQA_USER: ${MQA_USER:-}
      MQA_PASSWORD: ${MQA_PASSWORD:-}
      MQA_MAX_HEAVY: ${MQA_MAX_HEAVY:-2}
      MQA_MAX_MB: ${MQA_MAX_MB:-200}
      MQA_MAX_CELLS: ${MQA_MAX_CELLS:-3000000}
    expose: ["8088"]
    mem_limit: ${MQA_MEM_LIMIT:-3g}

  compare:
    build:
      context: ../..
      dockerfile: apps/simulation_comparator/Dockerfile
    image: pinneapple/simulation-comparator:latest
    restart: unless-stopped
    environment:
      CMP_USER: ${CMP_USER:-}
      CMP_PASSWORD: ${CMP_PASSWORD:-}
      CMP_MAX_HEAVY: ${CMP_MAX_HEAVY:-2}
      CMP_MAX_MB: ${CMP_MAX_MB:-300}
      CMP_MAX_POINTS: ${CMP_MAX_POINTS:-2000000}
    expose: ["8089"]
    mem_limit: ${CMP_MEM_LIMIT:-3g}

  lineage:
    build:
      context: ../..
      dockerfile: apps/model_lineage/Dockerfile
    image: pinneapple/model-lineage:latest
    restart: unless-stopped
    environment:
      LIN_USER: ${LIN_USER:-}
      LIN_PASSWORD: ${LIN_PASSWORD:-}
      LIN_MAX_HEAVY: ${LIN_MAX_HEAVY:-2}
      LIN_MAX_MB: ${LIN_MAX_MB:-300}
    expose: ["8090"]
    mem_limit: ${LIN_MEM_LIMIT:-2g}

  interop:
    build:
      context: ../..
      dockerfile: apps/interop_hub/Dockerfile
    image: pinneapple/interop-hub:latest
    restart: unless-stopped
    environment:
      IOP_USER: ${IOP_USER:-}
      IOP_PASSWORD: ${IOP_PASSWORD:-}
      IOP_MAX_HEAVY: ${IOP_MAX_HEAVY:-2}
      IOP_MAX_MB: ${IOP_MAX_MB:-500}
      IOP_CACHE_MIN: ${IOP_CACHE_MIN:-30}
    expose: ["8091"]
    mem_limit: ${IOP_MEM_LIMIT:-3g}

  aero:
    build:
      context: ../..
      dockerfile: apps/aero_optimizer/Dockerfile
    image: pinneapple/aero-optimizer:latest
    restart: unless-stopped
    environment:
      ADO_USER: ${ADO_USER:-}
      ADO_PASSWORD: ${ADO_PASSWORD:-}
      ADO_MAX_HEAVY: ${ADO_MAX_HEAVY:-2}
    expose: ["8092"]
    mem_limit: ${ADO_MEM_LIMIT:-2g}

  # Static site; the models run in the visitor's browser, so this container only serves files.
  playground:
    build:
      context: ../..
      dockerfile: apps/playground/Dockerfile
    image: pinneapple/playground:latest
    restart: unless-stopped
    expose: ["8095"]
    mem_limit: ${PLG_MEM_LIMIT:-128m}

  # Optional local LLM for the Form Compiler: `docker compose --profile llm up -d ollama`, then
  # `docker compose exec ollama ollama pull <model>` and set UDR_OLLAMA_MODEL. Not published outside the network.
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    expose: ["11434"]

  lab:
    build:
      context: ../..
      dockerfile: pinneapple_lab/deploy/Dockerfile
    image: pinneapple/lab:latest
    restart: unless-stopped
    environment:
      LAB_USER: ${LAB_USER:-}
      LAB_PASSWORD: ${LAB_PASSWORD:-}
    volumes:
      - lab_data:/data/lab        # runs, figures and dataset shards: keep this volume
    expose: ["8093"]
    mem_limit: ${LAB_MEM_LIMIT:-1g}

  observatory:
    build:
      context: ../..
      dockerfile: apps/observatory/Dockerfile
    image: pinneapple/observatory:latest
    restart: unless-stopped
    environment:
      OBS_USER: ${OBS_USER:-}
      OBS_PASSWORD: ${OBS_PASSWORD:-}
      OBS_MAX_HEAVY: ${OBS_MAX_HEAVY:-2}
      OBS_TLE_GROUPS: ${OBS_TLE_GROUPS:-stations,visual}
    volumes:
      - obs_cache:/srv/cache      # CelesTrak TLE cache (refreshed every 6 h)
    expose: ["8094"]
    mem_limit: ${OBS_MEM_LIMIT:-1500m}

  runner:
    build:
      context: ../..
      dockerfile: apps/simulation_runner/Dockerfile
    image: pinneapple/simulation-runner:latest
    restart: unless-stopped
    environment:
      RUNNER_USER: ${RUNNER_USER:-}
      RUNNER_PASSWORD: ${RUNNER_PASSWORD:-}
      RUNNER_ADMIN_TOKEN: ${RUNNER_ADMIN_TOKEN:-}
      RUNNER_MAX_JOBS: ${RUNNER_MAX_JOBS:-2}
      RUNNER_MAX_CASES: ${RUNNER_MAX_CASES:-60}
      RUNNER_FREE_JOBS_RUN: ${RUNNER_FREE_JOBS_RUN:-}
      RUNNER_FREE_COMPUTE_SECONDS: ${RUNNER_FREE_COMPUTE_SECONDS:-}
      RUNNER_FREE_STORAGE_MB: ${RUNNER_FREE_STORAGE_MB:-}
      # RUNNER_SELF_HOSTED=1 runs any workflow the caller sends: never on a public server
    volumes:
      - runner_data:/data         # runs, step files, job queue, keys and usage: keep this volume
    expose: ["8110"]
    mem_limit: ${RUNNER_MEM_LIMIT:-1g}
  campaign:
    build:
      context: ../..
      dockerfile: apps/simulation_campaign/Dockerfile
    image: pinneapple/simulation-campaign:latest
    restart: unless-stopped
    environment:
      CAMPAIGN_USER: ${CAMPAIGN_USER:-}
      CAMPAIGN_PASSWORD: ${CAMPAIGN_PASSWORD:-}
      CAMPAIGN_MAX_JOBS: ${CAMPAIGN_MAX_JOBS:-2}
      CAMPAIGN_FREE_CAMPAIGNS: ${CAMPAIGN_FREE_CAMPAIGNS:-}
      CAMPAIGN_FREE_CASES_PLANNED: ${CAMPAIGN_FREE_CASES_PLANNED:-}
      CAMPAIGN_ADMIN_TOKEN: ${CAMPAIGN_ADMIN_TOKEN:-}
      CAMPAIGN_MAX_CASE_DIRS: ${CAMPAIGN_MAX_CASE_DIRS:-50}
    volumes:
      - campaign_data:/data       # jobs, campaign files, API keys, usage: keep this volume
    expose: ["8096"]
    mem_limit: ${CAMPAIGN_MEM_LIMIT:-1g}

  uncertainty:
    build:
      context: ../..
      dockerfile: apps/uncertainty_lab/Dockerfile
    image: pinneapple/uncertainty-lab:latest
    restart: unless-stopped
    environment:
      UQL_USER: ${UQL_USER:-}
      UQL_PASSWORD: ${UQL_PASSWORD:-}
      UQL_MAX_HEAVY: ${UQL_MAX_HEAVY:-2}
      UQL_MAX_JOBS: ${UQL_MAX_JOBS:-2}
      UQL_FREE_STUDIES: ${UQL_FREE_STUDIES:-}
      UQL_FREE_SCENARIOS: ${UQL_FREE_SCENARIOS:-}
      UQL_FREE_PROPAGATION_SAMPLES: ${UQL_FREE_PROPAGATION_SAMPLES:-}
      UQL_FREE_HF_RUNS: ${UQL_FREE_HF_RUNS:-}
      UQL_ADMIN_TOKEN: ${UQL_ADMIN_TOKEN:-}
      UQL_MAX_CASES: ${UQL_MAX_CASES:-2000}
      UQL_MAX_PROPAGATION: ${UQL_MAX_PROPAGATION:-20000}
      UQL_MAX_HF: ${UQL_MAX_HF:-40}
      UQL_MAX_MB: ${UQL_MAX_MB:-50}
    volumes:
      - uncertainty_data:/data    # jobs, uploads, API keys, usage: keep this volume
    expose: ["8098"]
    mem_limit: ${UQL_MEM_LIMIT:-1g}

  sensitivity:
    build:
      context: ../..
      dockerfile: apps/sensitivity_lab/Dockerfile
    image: pinneapple/sensitivity-lab:latest
    restart: unless-stopped
    environment:
      SEN_USER: ${SEN_USER:-}
      SEN_PASSWORD: ${SEN_PASSWORD:-}
      SEN_MAX_HEAVY: ${SEN_MAX_HEAVY:-2}
      SEN_MAX_JOBS: ${SEN_MAX_JOBS:-2}
      SEN_FREE_STUDIES: ${SEN_FREE_STUDIES:-}
      SEN_FREE_EVALUATIONS: ${SEN_FREE_EVALUATIONS:-}
      SEN_FREE_PARAMETERS: ${SEN_FREE_PARAMETERS:-}
      SEN_ADMIN_TOKEN: ${SEN_ADMIN_TOKEN:-}
      SEN_MAX_EVALS: ${SEN_MAX_EVALS:-400000}
      SEN_MAX_PARAMS: ${SEN_MAX_PARAMS:-30}
      SEN_MAX_MB: ${SEN_MAX_MB:-50}
    volumes:
      - sensitivity_data:/data    # jobs, uploads, API keys, usage: keep this volume
    expose: ["8099"]
    mem_limit: ${SEN_MEM_LIMIT:-1g}

  validate:
    build:
      context: ../..
      dockerfile: apps/validation_lab/Dockerfile
    image: pinneapple/validation-lab:latest
    restart: unless-stopped
    environment:
      VAL_USER: ${VAL_USER:-}
      VAL_PASSWORD: ${VAL_PASSWORD:-}
      VAL_MAX_HEAVY: ${VAL_MAX_HEAVY:-2}
      VAL_MAX_MB: ${VAL_MAX_MB:-200}
    expose: ["8107"]
    mem_limit: ${VAL_MEM_LIMIT:-1g}

  evidence:
    build:
      context: ../..
      dockerfile: apps/evidence_report/Dockerfile
    image: pinneapple/evidence-report:latest
    restart: unless-stopped
    environment:
      EVR_USER: ${EVR_USER:-}
      EVR_PASSWORD: ${EVR_PASSWORD:-}
      EVR_MAX_HEAVY: ${EVR_MAX_HEAVY:-2}
      EVR_MAX_MB: ${EVR_MAX_MB:-200}
      EVR_FREE_REPORTS: ${EVR_FREE_REPORTS:-}
      EVR_FREE_DOWNLOADS: ${EVR_FREE_DOWNLOADS:-}
      EVR_ADMIN_TOKEN: ${EVR_ADMIN_TOKEN:-}
    volumes:
      - evidence_data:/data       # API keys and usage of the shared runtime: keep this volume
    expose: ["8113"]
    mem_limit: ${EVR_MEM_LIMIT:-1g}

  calibration:
    build:
      context: ../..
      dockerfile: apps/calibration_lab/Dockerfile
    image: pinneapple/calibration-lab:latest
    restart: unless-stopped
    environment:
      CALIB_USER: ${CALIB_USER:-}
      CALIB_PASSWORD: ${CALIB_PASSWORD:-}
      CALIB_MAX_JOBS: ${CALIB_MAX_JOBS:-2}
      CALIB_ADMIN_TOKEN: ${CALIB_ADMIN_TOKEN:-}
      CALIB_IDENTIFIABILITY_URL: ${CALIB_IDENTIFIABILITY_URL:-https://identifiability.pinneapple.org}
      CALIB_FREE_CALIBRATIONS: ${CALIB_FREE_CALIBRATIONS:-}
      CALIB_FREE_METHOD_RUNS: ${CALIB_FREE_METHOD_RUNS:-}
      CALIB_FREE_PINN_RUNS: ${CALIB_FREE_PINN_RUNS:-}
    volumes:
      - calibration_data:/data          # jobs, API keys, usage, uploads (SQLite): keep this volume
    expose: ["8101"]
    mem_limit: ${CALIB_MEM_LIMIT:-1g}

  identifiability:
    build:
      context: ../..
      dockerfile: apps/identifiability_lab/Dockerfile
    image: pinneapple/identifiability-lab:latest
    restart: unless-stopped
    environment:
      IDENT_USER: ${IDENT_USER:-}
      IDENT_PASSWORD: ${IDENT_PASSWORD:-}
      IDENT_MAX_JOBS: ${IDENT_MAX_JOBS:-2}
      IDENT_ADMIN_TOKEN: ${IDENT_ADMIN_TOKEN:-}
      IDENT_FREE_ANALYSES: ${IDENT_FREE_ANALYSES:-}
      IDENT_FREE_PARAMETERS: ${IDENT_FREE_PARAMETERS:-}
      IDENT_FREE_SCENARIOS: ${IDENT_FREE_SCENARIOS:-}
    volumes:
      - identifiability_data:/data          # jobs, API keys, usage, uploads (SQLite): keep this volume
    expose: ["8108"]
    mem_limit: ${IDENT_MEM_LIMIT:-1g}

  inverse-studio:
    build:
      context: ../..
      dockerfile: apps/inverse_studio/Dockerfile
    image: pinneapple/inverse-studio:latest
    restart: unless-stopped
    environment:
      INVS_USER: ${INVS_USER:-}
      INVS_PASSWORD: ${INVS_PASSWORD:-}
      INVS_MAX_JOBS: ${INVS_MAX_JOBS:-2}
      INVS_ADMIN_TOKEN: ${INVS_ADMIN_TOKEN:-}
      INVS_HEAT_LAB_URL: ${INVS_HEAT_LAB_URL:-https://inverse.pinneapple.org}
      INVS_FREE_PROBLEMS: ${INVS_FREE_PROBLEMS:-}
      INVS_FREE_METHOD_RUNS: ${INVS_FREE_METHOD_RUNS:-}
      INVS_FREE_PINN_RUNS: ${INVS_FREE_PINN_RUNS:-}
    volumes:
      - inverse-studio_data:/data          # jobs, API keys, usage, uploads (SQLite): keep this volume
    expose: ["8104"]
    mem_limit: ${INVS_MEM_LIMIT:-1g}

  # Engineering GUI Agent: a separate, optional heavy image (FreeCAD + CfdOF + OpenFOAM + ParaView, about 5.5 GB).
  # Not started by a plain `up`: name it (`... up -d --build guiagent`) or use `--profile guiagent`.
  guiagent:
    build:
      context: ../..
      dockerfile: apps/guiagent/Dockerfile
    image: pinneapple/guiagent:latest
    profiles: ["guiagent"]
    restart: unless-stopped
    environment:
      GUIAGENT_USER: ${GUIAGENT_USER:-}
      GUIAGENT_PASSWORD: ${GUIAGENT_PASSWORD:-}
      GUIAGENT_MODE: ${GUIAGENT_MODE:-public}         # public: committed workflows only; selfhosted: uploads too
      GUIAGENT_MAX_JOBS: ${GUIAGENT_MAX_JOBS:-1}         # runs at once; further runs wait in the shared job queue
      GUIAGENT_ADMIN_TOKEN: ${GUIAGENT_ADMIN_TOKEN:-}   # X-Admin-Token for API keys when there is no login
      GUIAGENT_FREE_RUNS: ${GUIAGENT_FREE_RUNS:-}       # free use per caller and month (defaults 20 runs,
      GUIAGENT_FREE_COMPUTE_SECONDS: ${GUIAGENT_FREE_COMPUTE_SECONDS:-}   # 1800 s, 500 MB)
      GUIAGENT_FREE_STORAGE_MB: ${GUIAGENT_FREE_STORAGE_MB:-}
      GUIAGENT_KEEP_RUNS: ${GUIAGENT_KEEP_RUNS:-40}
      GUIAGENT_OLLAMA_URL: ${GUIAGENT_OLLAMA_URL:-http://ollama:11434}
      GUIAGENT_OLLAMA_MODEL: ${GUIAGENT_OLLAMA_MODEL:-}  # empty = rule-based reading of tasks
    volumes:
      - guiagent_data:/data       # runs and their evidence, job queue, API keys, usage: keep this volume
    expose: ["8115"]
    mem_limit: ${GUIAGENT_MEM_LIMIT:-2g}
    shm_size: 256m

  rom:
    build:
      context: ../..
      dockerfile: apps/rom_lab/Dockerfile
    image: pinneapple/rom-lab:latest
    restart: unless-stopped
    environment:
      ROM_USER: ${ROM_USER:-}
      ROM_PASSWORD: ${ROM_PASSWORD:-}
      ROM_MAX_JOBS: ${ROM_MAX_JOBS:-2}
      ROM_MAX_MB: ${ROM_MAX_MB:-200}
      ROM_MAX_BUDGET_S: ${ROM_MAX_BUDGET_S:-30}
      ROM_ADMIN_TOKEN: ${ROM_ADMIN_TOKEN:-}
      ROM_FREE_STUDIES: ${ROM_FREE_STUDIES:-}
      ROM_FREE_EXPORTS: ${ROM_FREE_EXPORTS:-}
      ROM_FREE_QUERIES: ${ROM_FREE_QUERIES:-}
    volumes:
      - rom_data:/data          # jobs, uploads, usage (shared runtime): keep this volume
    expose: ["8102"]
    mem_limit: ${ROM_MEM_LIMIT:-1g}

  meshless:
    build:
      context: ../..
      dockerfile: apps/meshless_lab/Dockerfile
    image: pinneapple/meshless-lab:latest
    restart: unless-stopped
    environment:
      MESHLESS_USER: ${MESHLESS_USER:-}
      MESHLESS_PASSWORD: ${MESHLESS_PASSWORD:-}
      MESHLESS_MAX_JOBS: ${MESHLESS_MAX_JOBS:-2}
      MESHLESS_MAX_NODES: ${MESHLESS_MAX_NODES:-20000}
      MESHLESS_MAX_PINN_S: ${MESHLESS_MAX_PINN_S:-30}
      MESHLESS_ADMIN_TOKEN: ${MESHLESS_ADMIN_TOKEN:-}
      MESHLESS_FREE_RUNS: ${MESHLESS_FREE_RUNS:-}
      MESHLESS_FREE_UNKNOWNS: ${MESHLESS_FREE_UNKNOWNS:-}
      MESHLESS_FREE_REPORTS: ${MESHLESS_FREE_REPORTS:-}
    volumes:
      - meshless_data:/data          # jobs, uploads, usage (shared runtime): keep this volume
    expose: ["8109"]
    mem_limit: ${MESHLESS_MEM_LIMIT:-1g}

  surrogate:
    build:
      context: ../..
      dockerfile: apps/surrogate_studio/Dockerfile
    image: pinneapple/surrogate-studio:latest
    restart: unless-stopped
    environment:
      SUR_USER: ${SUR_USER:-}
      SUR_PASSWORD: ${SUR_PASSWORD:-}
      SUR_ADMIN_TOKEN: ${SUR_ADMIN_TOKEN:-}
      SUR_REQUIRE_API_KEY: ${SUR_REQUIRE_API_KEY:-0}
      SUR_MAX_JOBS: ${SUR_MAX_JOBS:-2}
      SUR_MAX_BUDGET_S: ${SUR_MAX_BUDGET_S:-30}
      SUR_MAX_SEEDS: ${SUR_MAX_SEEDS:-3}
      SUR_FREE_TRAININGS: ${SUR_FREE_TRAININGS:-}
      SUR_FREE_INFERENCES: ${SUR_FREE_INFERENCES:-}
      SUR_FREE_HOSTED_MODELS: ${SUR_FREE_HOSTED_MODELS:-}
    volumes:
      - surrogate_data:/data      # jobs, uploads, hosted models, usage, API keys
    expose: ["8097"]
    mem_limit: ${SUR_MEM_LIMIT:-1g}

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      HSS_DOMAIN: ${HSS_DOMAIN:?set HSS_DOMAIN in .env}
      PCB_DOMAIN: ${PCB_DOMAIN:?set PCB_DOMAIN in .env}
      EDH_DOMAIN: ${EDH_DOMAIN:-datahealth.localhost}
      EDS_DOMAIN: ${EDS_DOMAIN:-standardizer.localhost}
      SMD_DOMAIN: ${SMD_DOMAIN:-simmeta.localhost}
      UDR_DOMAIN: ${UDR_DOMAIN:-udr.localhost}
      IHL_DOMAIN: ${IHL_DOMAIN:-inverse.localhost}
      PFL_DOMAIN: ${PFL_DOMAIN:-preflight.localhost}
      MQA_DOMAIN: ${MQA_DOMAIN:-mesh.localhost}
      CMP_DOMAIN: ${CMP_DOMAIN:-compare.localhost}
      LIN_DOMAIN: ${LIN_DOMAIN:-lineage.localhost}
      IOP_DOMAIN: ${IOP_DOMAIN:-interop.localhost}
      ADO_DOMAIN: ${ADO_DOMAIN:-aero.localhost}
      LAB_DOMAIN: ${LAB_DOMAIN:-lab.localhost}
      OBS_DOMAIN: ${OBS_DOMAIN:-observatory.localhost}
      PLG_DOMAIN: ${PLG_DOMAIN:-playground.localhost}
      RUNNER_DOMAIN: ${RUNNER_DOMAIN:-runner.localhost}
      CAMPAIGN_DOMAIN: ${CAMPAIGN_DOMAIN:-campaign.localhost}
      UQL_DOMAIN: ${UQL_DOMAIN:-uncertainty.localhost}
      SEN_DOMAIN: ${SEN_DOMAIN:-sensitivity.localhost}
      VAL_DOMAIN: ${VAL_DOMAIN:-validate.localhost}
      EVR_DOMAIN: ${EVR_DOMAIN:-evidence.localhost}
      CALIB_DOMAIN: ${CALIB_DOMAIN:-calibration.localhost}
      IDENT_DOMAIN: ${IDENT_DOMAIN:-identifiability.localhost}
      INVS_DOMAIN: ${INVS_DOMAIN:-inverse-studio.localhost}
      GUIAGENT_DOMAIN: ${GUIAGENT_DOMAIN:-guiagent.localhost}
      ROM_DOMAIN: ${ROM_DOMAIN:-rom.localhost}
      MESHLESS_DOMAIN: ${MESHLESS_DOMAIN:-meshless.localhost}
      SUR_DOMAIN: ${SUR_DOMAIN:-surrogate.localhost}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certificates: keep this volume
      - caddy_config:/config
